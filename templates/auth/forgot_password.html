{% extends "base.html" %}

{% block content %}
<style>
    .forgot-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f4f9;
        padding: 20px;
    }
    .forgot-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        max-width: 480px;
        width: 100%;
        padding: 40px 35px;
        text-align: center;
    }
    .icon-box {
        width: 50px;
        height: 50px;
        background-color: #eef2ff;
        color: #3b82f6;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }
    .title {
        font-weight: 700;
        color: #1e293b;
        font-size: 22px;
        margin-bottom: 8px;
    }
    .subtitle {
        color: #64748b;
        font-size: 12px;
        margin-bottom: 25px;
        line-height: 1.5;
    }
    .form-label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        text-align: left;
        display: block;
        margin-bottom: 6px;
    }
    .form-control {
        background-color: #f8fafc;
        font-size: 14px;
        padding: 10px 12px;
        border-color: #e2e8f0;
    }
    .input-group-text {
        background-color: #f8fafc;
        border-color: #e2e8f0;
        color: #94a3b8;
    }
    .btn-primary-custom {
        background-color: #2563eb;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 14px;
        width: 100%;
    }
    .btn-outline-custom {
        border: 1px solid #cbd5e1;
        background: transparent;
        color: #2563eb;
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 14px;
        width: 100%;
    }
    .divider-text {
        font-size: 11px;
        color: #94a3b8;
        margin: 20px 0;
        position: relative;
    }
    .back-link {
        font-size: 13px;
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }
    .footer-text {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 40px;
    }
</style>

<div class="forgot-container">
    <div class="forgot-card">
        <!-- Close / Cancel Icon Box -->
        <div class="icon-box">
            <i class="fa-solid fa-xmark fa-lg"></i>
        </div>

        <h3 class="title">Forgot Password?</h3>
        <p class="subtitle">Enter your registered email address and we will send you a password reset link.</p>

        <form action="#" method="POST">
            <div class="mb-4 text-start">
                <label class="form-label">Registered Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email address" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom mb-3">
                <i class="fa-regular fa-paper-plane me-2"></i> Send Reset Link
            </button>

            <div class="divider-text">OR</div>

            <p class="text-muted small mb-2" style="font-size: 11px;">We will send an OTP to your email</p>
            
            <button type="button" class="btn btn-outline-custom mb-4">
                <i class="fa-solid fa-shield-halved me-2"></i> Send OTP Instead
            </button>

            <div>
                <a href="{{ url_for('auth.login') }}" class="back-link">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </form>

        <div class="footer-text">
            Happy Pets Clinic Management System v2.4 — Secure Authorization Node
        </div>
    </div>
</div>
{% endblock %}
