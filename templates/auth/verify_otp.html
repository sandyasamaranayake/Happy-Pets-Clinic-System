{% extends "base.html" %}

{% block content %}
<style>
    .otp-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f4f9;
        padding: 20px;
    }
    .otp-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        max-width: 440px;
        width: 100%;
        padding: 40px 35px;
        text-align: center;
    }
    .icon-box {
        width: 50px;
        height: 50px;
        background-color: #eef2ff;
        color: #3b82f6;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }
    .title {
        font-weight: 700;
        color: #1e293b;
        font-size: 22px;
        margin-bottom: 8px;
    }
    .subtitle {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 25px;
        line-height: 1.5;
    }
    .otp-input {
        letter-spacing: 12px;
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        background-color: #f8fafc;
        border-color: #cbd5e1;
    }
    .btn-primary-custom {
        background-color: #2563eb;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 14px;
        width: 100%;
    }
    .back-link {
        font-size: 13px;
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<div class="otp-container">
    <div class="otp-card">
        <div class="icon-box">
            <i class="fa-solid fa-shield-halved fa-lg"></i>
        </div>

        <h3 class="title">Enter OTP Code</h3>
        <p class="subtitle">We have sent a 6-digit verification code to<br><strong>{{ email }}</strong></p>

        <form action="{{ url_for('auth.verify_otp', email=email) }}" method="POST">
            <div class="mb-4">
                <input type="text" name="otp" class="form-control otp-input" placeholder="••••••" maxlength="6" required autofocus autocomplete="off">
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom mb-4">
                Verify Code
            </button>

            <div>
                <a href="{{ url_for('auth.forgot_password') }}" class="back-link">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Forgot Password
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
