{% extends "base.html" %}

{% block content %}
<style>
    .reset-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f0f4f9;
        padding: 20px;
    }
    .reset-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        max-width: 440px;
        width: 100%;
        padding: 40px 35px;
        text-align: center;
    }
    .icon-box {
        width: 50px;
        height: 50px;
        background-color: #eef2ff;
        color: #3b82f6;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }
    .title {
        font-weight: 700;
        color: #1e293b;
        font-size: 22px;
        margin-bottom: 8px;
    }
    .subtitle {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 25px;
    }
    .form-label {
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        text-align: left;
        display: block;
        margin-bottom: 6px;
    }
    .form-control {
        background-color: #f8fafc;
        font-size: 14px;
        padding: 10px 12px;
        border-color: #e2e8f0;
    }
    .input-group-text {
        background-color: #f8fafc;
        border-color: #e2e8f0;
        color: #94a3b8;
    }
    .btn-primary-custom {
        background-color: #2563eb;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-weight: 600;
        font-size: 14px;
        width: 100%;
    }
</style>

<div class="reset-container">
    <div class="reset-card">
        <div class="icon-box">
            <i class="fa-solid fa-key fa-lg"></i>
        </div>

        <h3 class="title">Set New Password</h3>
        <p class="subtitle">Please enter your new password below.</p>

        <form action="{{ url_for('auth.reset_password') }}" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
