<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Care Assistant - Happy Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .chat-card { max-width: 700px; margin: 40px auto; border-radius: 16px; }
    .chat-header { background: #1e2a4a; color: white; border-radius: 16px 16px 0 0; }
    #chatBox { height: 400px; overflow-y: auto; background: #fafbfd; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; white-space: pre-wrap; }
    .msg-user { background: #2563eb; color: white; margin-left: auto; }
    .msg-ai { background: white; border: 1px solid #e3e8f0; }
  </style>
</head>
<body>

<div class="chat-card" style="margin-bottom:-30px;">
  <a href="{{ url_for('dashboard') }}" class="btn btn-link px-0">&larr; Back to Dashboard</a>
</div>

<div class="card chat-card shadow-sm">
  <div class="chat-header p-3">
    <h5 class="mb-0">🐾 Vet AI Care Assistant</h5>
    <small>Tell me your pet's problem. This is first-aid advice only, not a diagnosis.</small>
  </div>

  <div id="chatBox" class="p-3">
    <div class="msg msg-ai">Hello! What is wrong with your pet? Please tell me the animal (dog/cat), age, and the problem.</div>
  </div>

  <div class="p-3 border-top">
    <div class="input-group">
      <input id="userInput" type="text" class="form-control" placeholder="Example: My 3 month puppy is vomiting">
      <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>
  </div>
</div>

<script>
  const chatBox = document.getElementById("chatBox");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  // Colour for each urgency level
  const badgeColor = {
    "Emergency": "bg-danger",
    "Visit clinic soon": "bg-warning text-dark",
    "Home care": "bg-success"
  };

  // Add a message bubble to the chat
  function addMessage(text, who, urgency) {
    const div = document.createElement("div");
    div.className = "msg " + (who === "user" ? "msg-user" : "msg-ai");
    if (urgency) {
      const badge = document.createElement("span");
      badge.className = "badge mb-2 " + (badgeColor[urgency] || "bg-secondary");
      badge.textContent = urgency;
      div.appendChild(badge);
      div.appendChild(document.createElement("br"));
    }
    div.appendChild(document.createTextNode(text));
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  // Send the question to Flask
  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    sendBtn.disabled = true;
    const waiting = addMessage("Thinking...", "ai");

    try {
      const res = await fetch("/ai-assistant/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });
      const data = await res.json();
      waiting.remove();
      if (data.error) {
        addMessage(data.error, "ai");
      } else {
        addMessage(data.reply, "ai", data.urgency);
      }
    } catch (e) {
      waiting.remove();
      addMessage("Connection problem. Please try again.", "ai");
    }
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>

</body>
</html>
